<!DOCTYPE html>
<html lang="en">
<head>
    <title>Katalog</title>
    <style>
        body { background-color: #f4f4f4; font-family: sans-serif; }

        .wadah-kartu {
            display: flex;
            justify-content: space-evenly;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .kartu {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            width: 250px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 1);
        }
    </style>
</head>
<body>
    <h2 style="text-align: center; margin-top: 40px;">Kompetensi Keahlian</h2>

    <div class="wadah-kartu">

    <div class="kartu">
        <h3>RPL</h3>
        <p>Rekayasa Perangkat Lunak</p>
    </div>

    <div class="kartu">
        <h3>TKJ</h3>
        <p>Teknik Komputer & Jaringan</p>
    </div>

    <div class="kartu">
        <h3>DKV</h3>
        <p>Desain Komunikasi Visual</p>
    </div>
   </div>
</body>
</html>
